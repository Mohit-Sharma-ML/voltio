name: Release checks

# Verification only — deliberately does NOT build or upload a DMG.
#
# Why not build here: the DMG must be signed with a real "Apple Development"
# identity. scripts/build_app.sh documents that ad-hoc signing ("-") breaks the
# widget extension (containermanagerd rejects team-less signatures, so the
# widget never appears in the gallery). GitHub-hosted runners have no signing
# certificate, so a workflow-built DMG would be a broken artifact.
#
# The maintainer therefore builds and uploads from a machine with the
# certificate; this workflow blocks a tag that should not become a release.
# See Docs/RELEASING.md for the full procedure.
on:
  push:
    tags: ['v*']
  # Manual run for testing the release path without pushing a tag. Safe: the
  # draft step does nothing when the tag's release already exists.
  workflow_dispatch:

permissions:
  # `contents: write` is required only for the final step, which creates a
  # DRAFT release so the maintainer has somewhere to attach the signed DMG. It
  # does not publish anything: a draft stays invisible until `gh release edit
  # --draft=false`. (Earlier this was `read`, which made that step fail with
  # HTTP 403 "Resource not accessible by integration".)
  contents: write

jobs:
  verify:
    name: Verify tag is release-ready
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag matches the bundled version
        run: |
          set -euo pipefail
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Voltio-Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Resources/Voltio-Info.plist)
          WIDGET_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/VoltioWidgets-Info.plist)
          WIDGET_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Resources/VoltioWidgets-Info.plist)
          echo "app=$VERSION($BUILD) widget=$WIDGET_VERSION($WIDGET_BUILD) ref=$GITHUB_REF"

          # The app and its extension must always agree, or WidgetKit reports a
          # mismatched bundle version. This holds for tag pushes and manual runs.
          test "$VERSION" = "$WIDGET_VERSION" || {
            echo "::error::App and widget versions differ ($VERSION vs $WIDGET_VERSION)"
            exit 1
          }
          test "$BUILD" = "$WIDGET_BUILD" || {
            echo "::error::App and widget build numbers differ ($BUILD vs $WIDGET_BUILD)"
            exit 1
          }

          # A tag must match the bundled version. A manual run on a branch has no
          # tag to compare against — the remaining checks still apply.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            test "$TAG" = "$VERSION" || {
              echo "::error::Tag $TAG does not match CFBundleShortVersionString $VERSION"
              exit 1
            }
            echo "✔ tag $TAG matches bundled version $VERSION"
          else
            echo "Not a tag push — skipping tag/version comparison."
          fi

      - name: CHANGELOG documents this version
        run: |
          set -euo pipefail
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Voltio-Info.plist)
          grep -q "## \[$VERSION\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          }

      - name: Tag commit is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi
          echo "✔ $GITHUB_REF_NAME is an ancestor of origin/main"

      # A tag alone must never publish: the DMG is uploaded by hand after a
      # local build. Creating the release here as a DRAFT gives the maintainer a
      # place to attach artifacts without exposing an empty release to users.
      - name: Create draft release if absent
        # Only for real tag pushes. A manual workflow_dispatch run on a branch
        # must not create a release named after that branch.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — leaving it untouched."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" \
            --notes "Draft created by CI. Attach Voltio.dmg and Voltio.dmg.sha256 from a signed local build (see RELEASING.md), then publish."
